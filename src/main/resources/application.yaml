spring:
  application:
    name: Cold Email Sender
  profiles:
    active: local
  config:
    import: "classpath:envVariable.properties"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${username}
    password: ${password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
